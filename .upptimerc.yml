status-website:
  cname: status.fuzevpn.com
  name: FuzeVPN Status
  logoUrl: https://status.fuzevpn.com/fuzevpn-emblem.svg
  favicon: https://status.fuzevpn.com/favicon-32.png
  faviconSvg: https://status.fuzevpn.com/favicon.svg
  themeUrl: https://status.fuzevpn.com/fuzevpn-theme.css
  introTitle: "FuzeVPN service status"
  introMessage: >-
    Live status of FuzeVPN services and VPN locations, checked every 5 minutes by independent probes outside our infrastructure. If sign-in is down, new connections fail but sessions that are already connected keep working. Response times are full HTTPS requests, not pings: see the note at the bottom of the page.
  navbar:
    - title: Status
      href: /
    - title: FuzeVPN
      href: https://fuzevpn.com

i18n:
  averageResponseTime: "HTTPS response time: $TIMEms"
  averageResponseTimeTitle: HTTPS response time
  footer: "**About response times.** Each figure is a full HTTPS request (DNS lookup, connection, encryption handshake, then the reply) sent by a monitoring probe located near the server. It is not a ping and it is not measured from your device. A full request takes several times longer than a ping, so these figures are higher than the latency shown in the FuzeVPN app and do not reflect your connection speed.<br><br>[FuzeVPN](https://fuzevpn.com) · Monitoring powered by [Upptime](https://upptime.js.org)"

# Schedules, shifted off the top of the hour (GitHub runs those late)
workflowSchedule:
  graphs: "7 0 * * *"
  responseTime: "11 23 * * *"
  staticSite: "13 1 * * *"
  summary: "19 0 * * *"
  updateTemplate: "23 0 * * *"
  updates: "29 3 * * *"
  uptime: "2-59/5 * * * *"
