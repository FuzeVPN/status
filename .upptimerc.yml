# Configuration Upptime pour status.fuzevpn.com
# Documentation : https://upptime.js.org/docs/configuration

owner: FuzeVPN
repo: status

sites:
  - name: Website
    url: https://fuzevpn.com
    icon: https://status.fuzevpn.com/favicon.svg
    type: globalping
    location: Western Europe
  - name: Web app
    url: https://app.fuzevpn.com
    icon: https://status.fuzevpn.com/favicon.svg
    type: globalping
    location: Western Europe
  - name: Sign-in and new connections (API)
    url: https://api.fuzevpn.com/healthz
    icon: https://status.fuzevpn.com/favicon.svg
    type: globalping
    location: Western Europe
    expectedStatusCodes:
      - 200

  # Les noeuds VPN ci-dessous sont geres par scripts/sync-nodes.mjs.
  # Ajout automatique depuis https://api.fuzevpn.com/v1/locations.
  # Chaque sonde part de Globalping, depuis un lieu proche du noeud (location).
  # Un nouveau noeud recoit son code pays ; a affiner a la main si besoin.
  # Retrait manuel uniquement : l'API retire aussi un noeud en panne ou sature,
  # il ne doit donc pas disparaitre d'ici pour autant.
  # nodes:start
  - name: "VPN - Sao Paulo 01 (BR)"
    url: https://sao-paulo-01.fuzevpn.com/ping
    icon: https://status.fuzevpn.com/flags/br.svg
    type: globalping
    location: Sao Paulo
    expectedStatusCodes:
      - 204
